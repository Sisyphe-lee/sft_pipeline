# Experimental: GPU kernel and full-model acceptance remain outstanding.
# Same data/loss semantics as 9B; separate full-language BF16 model path via CLI.
learning_rate: 1.0e-5
warmup_ratio: 0.05
max_grad_norm: 1.0
num_train_epochs: 5.0
max_steps: -1
global_batch_size: 32
max_input_tokens: 196608
truncate_history: false
freeze_vision: true
# n-gram embedding(一整张 51.2B 的表,bf16 下 95 GiB)冻结,整张放在主机内存里(每个节点一份),不交给 ZeRO-3:
# ZeRO-3 每步都要把它整张聚合到每张卡上(聚合时两份),卡数再多也装不下。其余 126B 全部训练。
resident_parameters: ple.ple_embedding.ngram_embedding.weight
lora: false
gradient_checkpointing: true
attn_implementation: sdpa
zero3_init: true
flashnext_qsa: true
deepspeed: ../training/qwen3_5_sft_zero3_noovl.json
sampling_strategy: length_grouped
loss_normalization: turn_mean
seed: 3407
validation: false
report_to: wandb
logging_steps: 1
save_strategy: epoch
save_total_limit: 5
dataloader_num_workers: 8
dataloader_prefetch_factor: 2
# Miles sparse backward uses atomics; do not claim deterministic execution.
deterministic: false
hard_exit_after_train: true
