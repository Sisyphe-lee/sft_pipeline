# Kimi 标注的设置。pattern 的定义在 patterns/<名字>.yaml，一个文件一个；改哪个只重标哪个。
patterns: []                                # 只标其中几个时写名字，如 [C1, D3]；空 = 全部
readings: [timeline, ideas, surprises]      # 通读几遍、各用哪份 patterns/<name>-protocol.md；第一遍的结果给后面几遍参考
per_url: 2                                  # 每个 Kimi 地址的并发请求数
together: 8                                 # 一次请求最多问几个“位置 + pattern”；同一次提交的两个位置总在一次请求里
judge_request: {reasoning_effort: low}      # 判定请求的附加参数。low 比默认的 high 快约 3 倍，抽查质量相当；个别 pattern 在自己的文件里写 effort: high
read_request:                               # 各遍通读的附加参数，按通读的名字写；没写的那遍用默认的 high
  ideas: {reasoning_effort: low}            # 这两遍只给 C1、D2、D3 找位置，用 low：快 4 倍以上，C1 的标签少约四分之一，D2 少一半
  surprises: {reasoning_effort: low}        # timeline 那遍保持 high：D4、C2、A3、B1 只靠它，low 档下这几类位置少四到七成
