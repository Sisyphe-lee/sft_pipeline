# 一个 pattern 一个文件。questions/steps/notes 是给 Kimi 看的，改了会重标这个 pattern；
# places/skip/effort（在哪问、用哪个思考档位问）和 submit/within/apart/span（是否打标签、标哪几步）是程序规则，改了不用重标。
name: L1
title: A local number before submitting
places:
- submit
questions:
- id: meant_to_score
  expect: true
  text: the submission is meant to score. False for a first look at the judge, for a submission made to learn something, and while the solution is still the files as given.
- id: measured_this_version
  expect: true
  text: a local run printed a score-like number for exactly the version that is submitted.
- id: changed_after_measuring
  expect: false
  text: a file of the solution changed between that run and the submit command.
- id: number_says_submit
  expect: true
  text: the number is at least as good as the best version's, and the agent gives it as the reason to submit. False when another number from the same run is clearly worse than the best version's.
steps:
- id: measure_step
  run: true
  then: <
  text: prints the number
- id: submit_step
  run: true
  submit: true
span:
  from: measure_step
  to: submit_step
  max: 6
