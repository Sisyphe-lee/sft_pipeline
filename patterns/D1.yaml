# 一个 pattern 一个文件。questions/steps/notes 是给 Kimi 看的，改了会重标这个 pattern；
# places/skip/effort（在哪问、用哪个思考档位问）和 submit/within/apart/span（是否打标签、标哪几步）是程序规则，改了不用重标。
name: D1
title: On leaving a direction, gather new evidence first
places:
- second_failure
questions:
- id: left_direction
  expect: true
  text: a direction failed at least twice and the agent leaves it for good. The leave step is the last time it drops the direction; a step after which it returns to the direction is not the leave.
- id: new_kind_of_evidence
  expect: true
  text: 'the first thing after leaving is a command that gets a kind of evidence it had not used so far: single cases, a profile, the task or scoring text, a probe of the judge, a test of why the direction failed.'
- id: used_for_next_change
  expect: true
  text: it says what the evidence shows, and the next change was not chosen before it.
steps:
- id: leave_step
  then: <=
- id: evidence_step
  run: true
  within: 2
  then: <=
- id: finding_step
span:
  from: evidence_step
  to: finding_step
  max: 4
