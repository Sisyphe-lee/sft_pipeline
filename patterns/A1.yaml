# 一个 pattern 一个文件。questions/steps/notes 是给 Kimi 看的，改了会重标这个 pattern；
# run/submit/span 是程序用来决定是否打标签、标哪几步的，改了不用重标，重新汇总即可。
name: A1
title: First submission early
places:
- start
questions:
- id: improved_before_first_submit
  expect: false
  text: before the first submission the agent tuned its solution or compared variants of it.
- id: read_answer
  expect: true
  text: it read what the judge returned and said something about it.
steps:
- id: submit_step
  run: true
  submit: true
  then: <=
  text: the first submit command
- id: read_step
span:
  from: submit_step
  to: read_step
  max: 4
