# 一个 pattern 一个文件。questions/steps/notes 是给 Kimi 看的，改了会重标这个 pattern；
# submit/within/apart/span 是程序用来决定是否打标签、标哪几步的，改了不用重标，重新汇总即可。
name: A4
title: One change per submission
places:
- submit
questions:
- id: scoring_change
  expect: true
  text: since the last judged version the agent changed something in the solution that can change the score. False when only documentation, comments, notes or logs changed, and when nothing changed.
- id: put_back
  expect: false
  text: the submitted version is an earlier judged version put back, alone or with tidying that is not meant to change the score, submitted to confirm it or to draw the score again.
- id: reads_to_compare
  expect: true
  text: the submission is made to learn from the score whether this change helped. False for the first submission and for a submission made to learn a fact about the judge.
- id: one_idea_or_each_measured
  expect: true
  text: everything changed since the last judged version implements one idea, or every change was measured on its own beforehand.
steps:
- id: first_edit_step
  then: <=
  text: the first edit that is still in the submitted version. Edits undone before the submission do not count
- id: submit_step
  run: true
  submit: true
span:
  from: first_edit_step
  to: submit_step
  max: 10
