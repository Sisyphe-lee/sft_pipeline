# 一个 pattern 一个文件。questions/steps/notes 是给 Kimi 看的，改了会重标这个 pattern；
# places/skip/effort（在哪问、用哪个思考档位问）和 submit/within/apart/span（是否打标签、标哪几步）是程序规则，改了不用重标。
name: D3
title: Keep a record of what was tried, and look back at it
places:
- record
- redo
- end
questions:
- id: record_file
  expect: true
  text: 'there is a file the agent keeps across experiments: it holds entries from at least two separate experiments, each saying what was tried and the number or outcome it gave. The output, log or saved result of a single run does not count, nor do the judge''s submission list and plain copies of versions.'
- id: older_results
  expect: true
  text: in a later command the agent reads that file, and what it reads are results older than the run it has just made, with at least one other experiment between the writing and the reading.
- id: read_feeds_decision
  expect: true
  text: what it read is used in the choice of what to do next.
steps:
- id: write_step
  run: true
  then: <
- id: read_step
  run: true
  then: <=
- id: decision_step
span:
  from: read_step
  to: decision_step
  max: 4
notes:
- 'Also `"file"`: the name of the file.'
