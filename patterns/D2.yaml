# 一个 pattern 一个文件。questions/steps/notes 是给 Kimi 看的，改了会重标这个 pattern；
# submit/within/apart/span 是程序用来决定是否打标签、标哪几步的，改了不用重标，重新汇总即可。
name: D2
title: Reopen an idea that was set aside
places:
- set_aside
- end
questions:
- id: named_and_untested
  expect: true
  text: the agent named something it could do and did not do it.
- id: tested_soon_after
  expect: false
  text: it took the idea up within about ten steps, or before two other attempts had finished.
- id: stalled_after
  expect: true
  text: between the named step and the reopening at least two finished attempts at other things (judged rounds, or complete local evaluations where there is no judge) brought no new best, or the agent said nothing was left to try. A bug, a crash, a hung run or a single worse result is not a stall.
- id: reopened_same_idea
  expect: true
  text: it went back to that same idea, not to a new one.
- id: test_reached_idea
  expect: true
  text: the idea itself was built and run, and its result is in the log. Looking up how to do it, probing an interface, and a test that failed for another reason first are not tests of the idea.
steps:
- id: named_step
  then: <
- id: reopen_step
  apart: 10
  text: the first step where it starts on the idea again
  then: <=
- id: test_step
  run: true
  within: 6
  text: the command that runs the test, not a step that only waits for it
span:
  steps:
  - reopen_step
  - test_step
